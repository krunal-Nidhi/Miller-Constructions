  <script type="text/babel">
    const { useState, useMemo } = React;

    // --- Rent vs Buy Simulator Component ---
    function RentVsBuySimulator() {
      const [homePrice, setHomePrice] = useState(600000);
      const [downPaymentPercent, setDownPaymentPercent] = useState(20);
      const [interestRate, setInterestRate] = useState(5.5);
      const [hoaFee, setHoaFee] = useState(250);
      const [propertyTaxRate, setPropertyTaxRate] = useState(1.2);
      const [monthlyRent, setMonthlyRent] = useState(2500);
      const [rentIncrease, setRentIncrease] = useState(3.0);
      const [homeAppreciation, setHomeAppreciation] = useState(3.5);
      const [investmentReturn, setInvestmentReturn] = useState(6.0);
      const [marginalTaxRate, setMarginalTaxRate] = useState(25);

      const simulationData = useMemo(() => {
        const years = 10;
        const downPayment = homePrice * (downPaymentPercent / 100);
        let loanBalance = homePrice - downPayment;
        const monthlyInterestRate = interestRate / 100 / 12;
        const totalPayments = 30 * 12;
        
        const monthlyMortgage = (interestRate > 0)
          ? loanBalance * (monthlyInterestRate * Math.pow(1 + monthlyInterestRate, totalPayments)) / (Math.pow(1 + monthlyInterestRate, totalPayments) - 1)
          : loanBalance / totalPayments;

        let currentHomeValue = homePrice;
        let currentRent = monthlyRent;
        let cumulativeBuyCost = downPayment;
        let cumulativeRentCost = 0;
        let renterInvestment = downPayment; // opportunity cost capital invested

        const data = [];

        for (let year = 1; year <= years; year++) {
          let yearlyMortgageInterest = 0;
          let yearlyMortgagePrincipal = 0;

          for (let month = 1; month <= 12; month++) {
            const interestPayment = loanBalance * monthlyInterestRate;
            const principalPayment = monthlyMortgage - interestPayment;
            yearlyMortgageInterest += interestPayment;
            yearlyMortgagePrincipal += principalPayment;
            loanBalance -= principalPayment;
          }

          const yearlyPropertyTax = currentHomeValue * (propertyTaxRate / 100);
          const taxSavings = (yearlyMortgageInterest + yearlyPropertyTax) * (marginalTaxRate / 100);
          const yearlyBuyExpense = (monthlyMortgage + hoaFee) * 12 + yearlyPropertyTax - taxSavings;
          
          cumulativeBuyCost += yearlyBuyExpense;
          currentHomeValue *= (1 + homeAppreciation / 100);

          const yearlyRentExpense = currentRent * 12;
          cumulativeRentCost += yearlyRentExpense;
          currentRent *= (1 + rentIncrease / 100);

          // Renter invests down payment & monthly cash diff
          renterInvestment *= (1 + investmentReturn / 100);
          const netBuyEquity = currentHomeValue - loanBalance;

          data.push({
            year: `Year ${year}`,
            homeValue: Math.round(currentHomeValue),
            buyEquity: Math.round(netBuyEquity),
            buyOutflow: Math.round(cumulativeBuyCost),
            rentOutflow: Math.round(cumulativeRentCost),
            renterPortfolio: Math.round(renterInvestment)
          });
        }
        return data;
      }, [homePrice, downPaymentPercent, interestRate, hoaFee, propertyTaxRate, monthlyRent, rentIncrease, homeAppreciation, investmentReturn, marginalTaxRate]);

      const finalYear = simulationData[simulationData.length - 1];
      const buyerNetWorth = finalYear.buyEquity - (finalYear.buyOutflow - (homePrice * downPaymentPercent / 100));
      const renterNetWorth = finalYear.renterPortfolio - finalYear.rentOutflow;

      return (
        <div class="bg-white rounded-2xl shadow-xl p-6 lg:p-10 border border-slate-100">
          <div class="mb-8 border-b pb-6">
            <h2 class="text-3xl font-bold text-slate-900">10-Year Rent vs. Buy Simulator</h2>
            <p class="text-slate-600 mt-2">Model mortgage rates, HOA fees, down payments, tax deductions, and property equity vs renting in Alberta.</p>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            {/* Controls */}
            <div class="space-y-5 bg-slate-50 p-6 rounded-xl border border-slate-200 text-sm">
              <h3 class="font-bold text-slate-800 text-lg border-b pb-2">Financial Parameters</h3>
              
              <div>
                <label class="flex justify-between font-medium text-slate-700">
                  <span>Home Price ($)</span>
                  <span class="font-bold text-slate-900">${homePrice.toLocaleString()}</span>
                </label>
                <input type="range" min="200000" max="2000000" step="25000" value={homePrice} onChange={e => setHomePrice(Number(e.target.value))} class="w-full mt-1 accent-amber-600"/>
              </div>

              <div>
                <label class="flex justify-between font-medium text-slate-700">
                  <span>Down Payment (%)</span>
                  <span class="font-bold text-slate-900">{downPaymentPercent}% (${(homePrice * downPaymentPercent / 100).toLocaleString()})</span>
                </label>
                <input type="range" min="5" max="50" step="1" value={downPaymentPercent} onChange={e => setDownPaymentPercent(Number(e.target.value))} class="w-full mt-1 accent-amber-600"/>
              </div>

              <div>
                <label class="flex justify-between font-medium text-slate-700">
                  <span>Mortgage Rate (%)</span>
                  <span class="font-bold text-slate-900">{interestRate}%</span>
                </label>
                <input type="range" min="2.0" max="10.0" step="0.1" value={interestRate} onChange={e => setInterestRate(Number(e.target.value))} class="w-full mt-1 accent-amber-600"/>
              </div>

              <div>
                <label class="flex justify-between font-medium text-slate-700">
                  <span>Monthly Rent ($)</span>
                  <span class="font-bold text-slate-900">${monthlyRent.toLocaleString()}</span>
                </label>
                <input type="range" min="1000" max="10000" step="100" value={monthlyRent} onChange={e => setMonthlyRent(Number(e.target.value))} class="w-full mt-1 accent-amber-600"/>
              </div>

              <div>
                <label class="flex justify-between font-medium text-slate-700">
                  <span>Monthly HOA Fee ($)</span>
                  <span class="font-bold text-slate-900">${hoaFee}</span>
                </label>
                <input type="range" min="0" max="1000" step="25" value={hoaFee} onChange={e => setHoaFee(Number(e.target.value))} class="w-full mt-1 accent-amber-600"/>
              </div>

              <div>
                <label class="flex justify-between font-medium text-slate-700">

                </label>
                <input type="range" min="10" max="50" step="1" value={marginalTaxRate} onChange={e => setMarginalTaxRate(Number(e.target.value))} class="w-full mt-1 accent-amber-600"/>
              </div>
            </div>

            {/* Results / Visual Summary */}
            <div class="lg:col-span-2 space-y-6">
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="p-5 bg-amber-50 border border-amber-200 rounded-xl">
                  <span class="text-amber-800 text-xs font-bold uppercase tracking-wider">Buying Equity (Year 10)</span>
                  <p class="text-3xl font-extrabold text-amber-900 mt-2">${finalYear.buyEquity.toLocaleString()}</p>
                  <p class="text-xs text-amber-700 mt-1">Projected Home Value: ${finalYear.homeValue.toLocaleString()}</p>
                </div>

                <div class="p-5 bg-slate-100 border border-slate-300 rounded-xl">
                  <span class="text-slate-600 text-xs font-bold uppercase tracking-wider">Total Rent Outflow (10 Yrs)</span>
                  <p class="text-3xl font-extrabold text-slate-900 mt-2">${finalYear.rentOutflow.toLocaleString()}</p>
                  <p class="text-xs text-slate-600 mt-1">Assumes {rentIncrease}% annual increase</p>
                </div>
              </div>

              {/* Data Table Summary */}
              <div class="overflow-x-auto border border-slate-200 rounded-xl">
                <table class="w-full text-left text-sm text-slate-700">
                  <thead class="bg-slate-100 text-slate-900 font-bold border-b border-slate-200">
                    <tr>
                      <th class="p-3">Timeline</th>
                      <th class="p-3">Home Value</th>
                      <th class="p-3">Buyer Equity</th>
                      <th class="p-3">Cumulative Rent</th>
                      <th class="p-3">Renter Investments</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-200">
                    {simulationData.map((row, idx) => (
                      <tr key={idx} class={idx % 2 === 0 ? "bg-white" : "bg-slate-50"}>
                        <td class="p-3 font-semibold text-slate-900">{row.year}</td>
                        <td class="p-3">${row.homeValue.toLocaleString()}</td>
                        <td class="p-3 font-medium text-emerald-700">${row.buyEquity.toLocaleString()}</td>
                        <td class="p-3 text-rose-700">${row.rentOutflow.toLocaleString()}</td>
                        <td class="p-3">${row.renterPortfolio.toLocaleString()}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      );
    }
